<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Maker</title>
  <meta name="theme-color" content="#f5f4f1">
  <script src="theme.js"></script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <script src="vendor/svg.min.js"></script>
  <script src="pwa.js" defer></script>
  <script src="tab-maker.js?v=pwa-11" type="module"></script>
  <script src="modules/tabs-menu.js" type="module"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100;300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="root editor-closed">
    <nav class="tabs-menu-header" aria-label="主菜单">
      <div class="tabs-menu-brand">
        <img src="assets/logo.png" width="30" height="30" alt="">
        <span>tab maker</span>
      </div>
      <button class="tabs-menu-toggle" id="tabs-menu-toggle">选曲</button>
      <button class="tabs-menu-toggle" id="toggle-script" aria-pressed="false">编辑器</button>
      <button class="tabs-menu-toggle" id="toggle-pitch" aria-pressed="false">显示音高</button>
      <button class="tabs-menu-toggle" id="decrease-tab-size" type="button" aria-label="缩小谱面文字" title="缩小谱面文字">−</button>
      <button class="tabs-menu-toggle" id="increase-tab-size" type="button" aria-label="放大谱面文字" title="放大谱面文字">+</button>
      <button class="tabs-menu-toggle" id="dump-tab-data">复制JSON</button>
      <button class="tabs-menu-toggle" id="toggle-theme" type="button" aria-label="深色模式" aria-pressed="false">浅色模式</button>
      <div class="tabs-menu-dropdown" id="tabs-menu-dropdown">
        <input type="text" class="tabs-menu-search" id="tabs-menu-search" placeholder="Search tabs...">
        <ul class="tabs-menu-list" id="tabs-menu-list"></ul>
      </div>
    </nav>
    <div id="tab-root">
      <div class="tab-info">
        <h1 id="tab-title"></h1>
        <ul>
          <li><label>原调: </label>
            <span id="original-key"></span>
          </li>
          <li><label for="key-select">转调：</label>
            <select id="key-select">
            </select>
            <span id="capo-position" role="status" aria-live="polite"></span>
          </li>
        </ul>
        <div id="chord-diagrams">
        </div>
      </div>
      <div id="tab-body"></div>
    </div>
    <div id="editor-splitter" role="separator" aria-orientation="vertical" aria-label="Resize editor"></div>
    <div class="editor">
      <select id="tab-select" hidden aria-hidden="true" tabindex="-1"></select>
      <textarea id="tab-script" class="hidden"></textarea>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module">
    import { tabMakerMain } from './tab-maker.js?v=pwa-11';
    document.addEventListener('DOMContentLoaded', tabMakerMain);
  </script>
</body>

</html>
