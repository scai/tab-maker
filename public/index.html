<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Maker</title>
  <meta name="theme-color" content="#f5f4f1">
  <script src="theme.js"></script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <script src="vendor/svg.min.js"></script>
  <script src="pwa.js" defer></script>
  <script src="tab-maker.js?v=pwa-14" type="module"></script>
  <script src="modules/landing.js" type="module"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100;300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="root editor-closed landing-active">
    <nav class="tabs-menu-header" aria-label="主菜单">
      <button class="tabs-menu-brand" id="go-home" type="button" aria-label="返回选曲首页">
        <img src="assets/logo.png" width="30" height="30" alt="">
        <span>tab maker</span>
      </button>
      <button class="tabs-menu-toggle" id="toggle-script" aria-pressed="false" disabled>编辑器</button>
      <button class="tabs-menu-toggle" id="toggle-pitch" aria-pressed="false" disabled>显示音高</button>
      <button class="tabs-menu-toggle" id="decrease-tab-size" type="button" aria-label="缩小谱面文字" title="缩小谱面文字" disabled>−</button>
      <button class="tabs-menu-toggle" id="increase-tab-size" type="button" aria-label="放大谱面文字" title="放大谱面文字" disabled>+</button>
      <button class="tabs-menu-toggle" id="toggle-theme" type="button" aria-label="深色模式" aria-pressed="false">浅色模式</button>
    </nav>
    <div id="tab-root">
      <main class="landing" aria-labelledby="landing-title">
        <h1 id="landing-title">选一首，开始弹</h1>
        <p>搜索歌曲或歌手，打开曲谱。</p>
        <label class="landing-search">
          <span aria-hidden="true">⌕</span>
          <input id="landing-search" type="search" aria-label="搜索歌曲或歌手" placeholder="搜索歌曲或歌手…" autocomplete="off">
        </label>
        <div class="landing-list-heading"><span>所有曲谱</span><span id="landing-count" aria-live="polite"></span></div>
        <ul id="landing-songs" class="landing-songs" aria-label="曲谱"><li role="status">正在加载曲库…</li></ul>
      </main>
      <div class="tab-info">
        <h1 id="tab-title"></h1>
        <ul>
          <li><label>原调: </label>
            <span id="original-key"></span>
          </li>
          <li><label for="key-select">转调：</label>
            <select id="key-select">
            </select>
            <span id="capo-position" role="status" aria-live="polite"></span>
          </li>
        </ul>
        <div id="chord-diagrams">
        </div>
      </div>
      <div id="tab-body"></div>
    </div>
    <div id="editor-splitter" role="separator" aria-orientation="vertical" aria-label="Resize editor"></div>
    <div class="editor">
      <div class="editor-toolbar" role="toolbar" aria-label="谱面编辑工具">
        <button id="split-lyrics" type="button" title="将选中的歌词拆成单字并添加 (0) 音高占位符">拆分歌词</button>
        <button id="undo-script" type="button" aria-label="撤销" title="撤销 (Ctrl/Cmd+Z)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 4 10l5 5M4 10h10a6 6 0 0 1 6 6v3"/></svg>
        </button>
        <button id="redo-script" type="button" aria-label="重做" title="重做 (Ctrl/Cmd+Shift+Z)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 5 5-5 5m5-5H10a6 6 0 0 0-6 6v3"/></svg>
        </button>
        <button id="dump-tab-data" type="button">复制JSON</button>
      </div>
      <div class="script-source">
        <pre id="script-highlight" aria-hidden="true"></pre>
        <textarea id="tab-script" class="hidden" aria-label="谱面源代码" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module">
    import { tabMakerMain } from './tab-maker.js?v=pwa-14';
    document.addEventListener('DOMContentLoaded', tabMakerMain);
  </script>
</body>

</html>
